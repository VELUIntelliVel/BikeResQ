<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .chat-container {
            height: 100vh; /* Ensures it fills the iframe */
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            max-height: calc(100vh - 60px);
        }

        .message {
            max-width: 70%;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .sent {
            background: #DCF8C6;
            align-self: flex-end;
        }

        .received {
            background: #ECECEC;
            align-self: flex-start;
        }

        .chat-input {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0px -2px 5px rgba(0, 0, 0, 0.1); /* Adds slight separation */
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 0 5px;
        }

        .send-btn, .icon-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn {
            color: #25D366;
        }

        .icon-btn {
            color: gray;
        }        
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box"></div>

        <div class="chat-input">
            <button class="icon-btn" id="camera-btn">📷</button>
            <button class="icon-btn" id="mic-btn">🎤</button>
            <input type="text" id="message" placeholder="Type a message...">
            <button class="send-btn" id="sendBtn">📩</button>
        </div>
    </div>
    <script>
        const socket = io();
        const chatBox = document.getElementById("chat-box");
        const messageInput = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");
        const cameraBtn = document.getElementById("camera-btn");
        const micBtn = document.getElementById("mic-btn");

        let userId = Math.random().toString(36).substring(2, 10);  // Unique user ID

        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message !== "") {
                const msgData = { type: "text", text: message, sender: userId };
                socket.emit("send_message", msgData);
                appendMessage("You", message, "sent");
                messageInput.value = "";
            }
        }

        // Receive messages from server
        socket.on("receive_message", (data) => {
            if (data.sender !== userId) {  
                if (data.type === "text") {
                    appendMessage("Other", data.text, "received");
                } else if (data.type === "image") {
                    appendImageMessage("Other", data.data);
                } else if (data.type === "audio") {
                    appendAudioMessage("Other", data.data);
                }
            }
        });

        function appendMessage(sender, message, type) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", type);
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 📷 Camera Capture & Send
        cameraBtn.addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement("video");
                video.srcObject = stream;
                video.play();

                const captureButton = document.createElement("button");
                captureButton.textContent = "Capture";
                captureButton.style.position = "absolute";
                document.body.appendChild(video);
                document.body.appendChild(captureButton);

                captureButton.addEventListener("click", () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext("2d").drawImage(video, 0, 0);
                    const imageData = canvas.toDataURL("image/png");

                    socket.emit("send_message", { type: "image", data: imageData, sender: userId });
                    appendImageMessage("You", imageData);

                    stream.getTracks().forEach(track => track.stop());
                    document.body.removeChild(video);
                    document.body.removeChild(captureButton);
                });
            } catch (error) {
                console.error("Camera access denied:", error);
            }
        });

        function appendImageMessage(sender, imageData) {
            const div = document.createElement("div");
            div.className = "message";
            div.innerHTML = `<strong>${sender}:</strong><br><img src="${imageData}" width="200">`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 🎤 Voice Recording & Send
        let mediaRecorder;
        let audioChunks = [];

        micBtn.addEventListener("mousedown", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        socket.emit("send_message", { type: "audio", data: reader.result, sender: userId });
                        appendAudioMessage("You", reader.result);
                    };
                };
            } catch (error) {
                console.error("Microphone access denied:", error);
            }
        });

        micBtn.addEventListener("mouseup", () => {
            if (mediaRecorder) {
                mediaRecorder.stop();
            }
        });

        function appendAudioMessage(sender, audioData) {
            const div = document.createElement("div");
            div.className = "message";
            div.innerHTML = `<strong>${sender}:</strong><br> <audio controls src="${audioData}"></audio>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
