<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mechanic Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet & Socket.io -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Control Geocoder -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <style>
        * {box-sizing: border-box;}
        body {margin: 0;font-family: Arial, sans-serif;text-align: center;background: #f5f5f5;}
        h2 {margin: 10px 0;font-size: 1.5rem;}
        #map {height: 60vh;width: 95%;max-width: 1000px;margin: 10px auto;border: 2px solid #ccc;border-radius: 10px;}
        #requestPopup {background: white;padding: 20px;border-radius: 10px;box-shadow: 0 0 10px rgba(0,0,0,0.2);max-width: 90%;width: 300px;margin: 10px auto;display: none;}
        #requestPopup p {margin-bottom: 10px;font-size: 1rem;}
        #requestPopup button {padding: 10px 20px;margin: 5px;border: none;background: #007BFF;color: white;border-radius: 5px;font-size: 0.95rem;cursor: pointer;}
        #requestPopup button:nth-child(3) {background: #dc3545;}
        #chat-icon {position: fixed;bottom: 20px;right: 20px;width: 50px;height: 50px;background-color: #25D366;color: white;font-size: 24px;text-align: center;line-height: 50px;border-radius: 50%;box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);cursor: grab;z-index: 10000;user-select: none;}
        #chat-box-container {position: fixed;bottom: 80px;right: 20px;width: 95%;max-width: 350px;height: 500px;background: white;border-radius: 10px;box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);overflow: hidden;z-index: 9999;display: none;}
        iframe {width: 100%;height: 100%;border: none;}
        @media (max-width: 600px) {
            #requestPopup {width: 90%;font-size: 0.9rem;}
            #requestPopup button {font-size: 0.85rem;padding: 8px 15px;}
            #chat-box-container {width: 90%;height: 60%;bottom: 70px;}
            #map { height: 50vh;}
        }
    </style>
</head>
<body>
    <h2>👨‍🔧 Mechanic Dashboard</h2>
    <!-- HTML: Positioning the search button on the map -->
    <div id="map"></div>
    <div id="requestPopup">
        <p id="popupText"></p>
        <button onclick="respondRequest(true)">Accept</button>
        <button onclick="respondRequest(false)">Decline</button>
    </div>
    <div id="chat-icon">💬</div>
    <div id="chat-box-container">
        <iframe src="http://127.0.0.1:5000/chat"></iframe>
    </div>
    <script>
        const socket = io();
        const mechanicId = "mech_" + Math.floor(Math.random() * 10000);
        let map = L.map("map").setView([13.0600, 80.2200], 13);
        let mechanicLat = 13.0600, mechanicLng = 80.2200;
        let routeControl, userMarker, mechanicMarker;
        let isTrackingActive = false;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
       // Add the geocoder control to the map
        // Add the geocoder control to the map
        L.Control.geocoder({
            defaultMarkGeocode: false
        })
        .on('markgeocode', function(e) {
            const bbox = e.geocode.bbox;
            const center = e.geocode.center;

            // Move the map view to the searched location
            map.fitBounds(bbox);

            // Add a marker to the searched location
            L.marker(center).addTo(map)
                .bindPopup(e.geocode.name)
                .openPopup();
        })
        .addTo(map);

        mechanicMarker = L.marker([mechanicLat, mechanicLng], { draggable: true }).addTo(map).bindPopup("You").openPopup();
        mechanicMarker.on("dragend", (e) => {
            let pos = e.target.getLatLng();
            mechanicLat = pos.lat;
            mechanicLng = pos.lng;
        });
        setInterval(() => {
            socket.emit("live_location", {
                userType: "mechanic",
                lat: mechanicLat,
                lng: mechanicLng
            });
        }, 3000);
        let currentRequestData = null;
        socket.on("incoming_request", (data) => {
            currentRequestData = data;
            const userAddress = data.address || `(${data.lat.toFixed(5)}, ${data.lng.toFixed(5)})`;
            document.getElementById("popupText").innerText =
                `🛠️ New request!\nIssue: ${data.issue}\nUser needs help at:\n${userAddress}\nAccept the request?`;
            document.getElementById("requestPopup").style.display = "block";
        });
        
        function respondRequest(accepted) {
            document.getElementById("requestPopup").style.display = "none";
            if (currentRequestData) {
                socket.emit("mechanic_response", {
                    user_id: currentRequestData.user_id,
                    mechanic_id: mechanicId,
                    accepted: accepted
                });

                if (accepted) {
                    isTrackingActive = true;

                    if (!userMarker) {
                        userMarker = L.marker([currentRequestData.lat, currentRequestData.lng])
                            .addTo(map).bindPopup("User Location").openPopup();
                    } else {
                        userMarker.setLatLng([currentRequestData.lat, currentRequestData.lng]);
                    }

                    drawRoute([mechanicLat, mechanicLng], [currentRequestData.lat, currentRequestData.lng]);
                }
            }
        }
        socket.on("live_location", (data) => {
            if (data.userType === "user" && isTrackingActive) {
                if (!userMarker) {
                    userMarker = L.marker([data.lat, data.lng]).addTo(map);
                } else {
                    userMarker.setLatLng([data.lat, data.lng]);
                }
                drawRoute([mechanicLat, mechanicLng], [data.lat, data.lng]);
            }
        });
        function drawRoute(from, to) {
            if (routeControl) map.removeControl(routeControl);
            routeControl = L.Routing.control({
                waypoints: [
                    L.latLng(from[0], from[1]),
                    L.latLng(to[0], to[1])
                ],
                createMarker: () => null,
                show: false,
                addWaypoints: false
            }).addTo(map);
        }
        const chatIcon = document.getElementById("chat-icon");
        const chatBox = document.getElementById("chat-box-container");
        let isDragging = false, offsetX, offsetY;
        chatIcon.addEventListener("click", () => {
            chatBox.style.display = (chatBox.style.display === "none") ? "block" : "none";
        });
        chatIcon.addEventListener("mousedown", (e) => {
            isDragging = true;
            offsetX = e.clientX - chatIcon.getBoundingClientRect().left;
            offsetY = e.clientY - chatIcon.getBoundingClientRect().top;
            chatIcon.style.cursor = "grabbing";
        });
        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            let x = e.clientX - offsetX;
            let y = e.clientY - offsetY;
            // Boundary check
            x = Math.max(0, Math.min(window.innerWidth - 50, x));
            y = Math.max(0, Math.min(window.innerHeight - 50, y));
            chatIcon.style.left = x + "px";
            chatIcon.style.top = y + "px";
        });
        document.addEventListener("mouseup", () => {
            isDragging = false;
            chatIcon.style.cursor = "grab";
        });
    </script>
</body>
</html>
